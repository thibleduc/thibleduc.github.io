<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LDH — Independent mobile games</title>
<style>
:root{--bg:#0c0a29;--card:#15123d;--ink:#e9e7ff;--mute:#a9a5d6;--accent:#7b4dff;--line:#2a2660}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:48px 22px 80px}
h1{font-size:30px;line-height:1.2;margin:0 0 8px}
h2{font-size:21px;margin:40px 0 10px;padding-top:24px;border-top:1px solid var(--line)}
h3{font-size:17px;margin:28px 0 6px}
p,li{color:var(--ink)}
.mute{color:var(--mute)}
a{color:#b9a4ff}
hr{border:0;border-top:1px solid var(--line);margin:32px 0}
code{background:var(--card);padding:1px 6px;border-radius:5px;font-size:.92em}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0;text-decoration:none;color:var(--ink)}
.card b{display:block;font-size:18px;margin-bottom:2px}
nav{margin-bottom:28px;font-size:14px}
nav a{color:var(--mute);text-decoration:none}
</style></head><body><main>
<h1>LDH</h1>
<p class="mute">Independent mobile games.</p>
